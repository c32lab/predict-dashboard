name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, cd]
    steps:
      - name: Deploy
        working-directory: /Users/zhwu/predict-dashboard
        run: |
          git pull --rebase origin main
          docker compose up --build -d
          echo "✅ predict-dashboard deployed"

      - name: Health check
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://localhost:18828/)
          if [ "$STATUS" = "200" ]; then
            echo "✅ Health check passed (HTTP $STATUS)"
          else
            echo "❌ Health check failed (HTTP $STATUS)"
            exit 1
          fi
